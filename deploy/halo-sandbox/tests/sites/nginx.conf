# Fake "internet" for the boundary test. One nginx answers for several names;
# each reply says which site it is, so a test can tell if it reached the wrong one.

server {
    listen 443 ssl default_server;
    server_name allowed.test;
    ssl_certificate     /certs/allowed.test.crt;
    ssl_certificate_key /certs/allowed.test.key;
    default_type text/plain;
    location = /headers {
        return 200 "cfid=$http_cf_access_client_id cfsecret=$http_cf_access_client_secret\n";
    }
    location / { return 200 "site=allowed\n"; }
}

server {
    listen 8443 ssl;
    server_name allowed.test;
    ssl_certificate     /certs/allowed.test.crt;
    ssl_certificate_key /certs/allowed.test.key;
    default_type text/plain;
    location / { return 200 "site=allowed-port-8443\n"; }
}

server {
    listen 80;
    server_name allowed.test;
    default_type text/plain;
    location / { return 200 "site=allowed-plain-http\n"; }
}

server {
    listen 443 ssl;
    server_name evil.test;
    ssl_certificate     /certs/evil.test.crt;
    ssl_certificate_key /certs/evil.test.key;
    default_type text/plain;
    location / { return 200 "site=evil\n"; }
}

# Not allowlisted, but covered by allowed.test's certificate (shared-cert case).
server {
    listen 443 ssl;
    server_name shared-cert.test;
    ssl_certificate     /certs/allowed.test.crt;
    ssl_certificate_key /certs/allowed.test.key;
    default_type text/plain;
    location / { return 200 "site=shared-cert\n"; }
}

server {
    listen 443 ssl;
    server_name untrusted.test;
    ssl_certificate     /certs/untrusted.test.crt;
    ssl_certificate_key /certs/untrusted.test.key;
    default_type text/plain;
    location / { return 200 "site=untrusted\n"; }
}

server {
    listen 443 ssl;
    server_name rebind.test;
    ssl_certificate     /certs/rebind.test.crt;
    ssl_certificate_key /certs/rebind.test.key;
    default_type text/plain;
    location / { return 200 "site=rebind\n"; }
}
